services:
  postgres:
    image: postgres:16-alpine
    environment:
      # The owner: runs migrations, owns the tables. The application's own role is
      # created by the migrations and has no such powers.
      POSTGRES_DB: flags
      POSTGRES_USER: flags
      POSTGRES_PASSWORD: flags
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flags -d flags"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - flags-pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLAGS_DB_URL: jdbc:postgresql://postgres:5432/flags
      FLAGS_DB_OWNER_USER: flags
      FLAGS_DB_OWNER_PASSWORD: flags
      FLAGS_DB_APP_USER: flags_app
      FLAGS_DB_APP_PASSWORD: flags_app
      # For running locally only. Anywhere else, set a real one: openssl rand -base64 48
      FLAGS_JWT_SECRET: ${FLAGS_JWT_SECRET:-local-development-signing-key-not-for-production}
    ports:
      - "8080:8080"

volumes:
  flags-pgdata:
